server {
    listen 80;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;

    # Handle /vibe_tracker without trailing slash with a relative redirect
    # to preserve protocol (https) and host.
    location = /vibe_tracker {
        return 301 vibe_tracker/;
    }

    location /vibe_tracker/ {
        index index.html;
        try_files $uri $uri/ /vibe_tracker/index.html;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /vibe_tracker/index.html;
    }

    error_page 404 /vibe_tracker/index.html;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
