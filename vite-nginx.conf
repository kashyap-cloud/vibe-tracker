server {
    listen 80;
    absolute_redirect off;
    port_in_redirect off;

    # Use a variable to help with relative redirects if needed, 
    # but absolute_redirect off should handle it.

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Removed $uri/ to avoid the automatic directory -> directory/ 301 redirect
        try_files $uri /vibe_tracker/index.html;
    }

    # Explicitly handle the subpath to ensure it serves index.html without redirecting
    location = /vibe_tracker {
        root /usr/share/nginx/html;
        try_files /vibe_tracker/index.html =404;
    }

    location = /vibe_tracker/ {
        root /usr/share/nginx/html;
        try_files /vibe_tracker/index.html =404;
    }

    error_page 404 /vibe_tracker/index.html;
    
    location = / {
        return 301 /vibe_tracker/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
